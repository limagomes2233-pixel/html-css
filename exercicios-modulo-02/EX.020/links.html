<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKS</title>
    <style>
        /*
        SELETORES PERSONALIZADOS
        # = ID
        . = CLASS
        : = PSEUDO CLASS
        :: = PSEUDO ELEMENT
        > = CHILDREN
        */
        body{
        font-family:Arial, Helvetica, sans-serif ;
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bolder;
        }
        a:visited{
            color: darkred;
        }
        a:hover{
            color:black;
            text-decoration: underline;
        }
        a:active{
            color:blueviolet;
        }
        .especial{
            background-color: rgb(189, 116, 21);
        }
        .especial::before{
            content:'⇒' ;
        }
        .especial::after{
            content:'⇐';
            text-decoration: none;
            font-weight: lighter;
            color:brown
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Repositorio do github</a></li>
        <li><a href="https://www.youtube.com/watch?v=m54omTveWa8&list=PLHz_AreHm4dlUpEXkY1AyVLQGcpSgVF8s&index=11" class="especial">Canal do YouTube</a></li>
        <li><a href=" https://www.cursoemvideo.com" target="_blank">Site do cursoEmVideo</a></li>
       
    </ul>
</body>
</html>
