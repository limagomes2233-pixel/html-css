<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        body{
            text-align: justify;
        }
        h1{ /* box-level*/ 
           background-color: whitesmoke;
            height: 300px;
            width: 300px;

           border: 10px solid darkslategrey;

           padding: 10px;

           margin: 20px auto 40px auto;

           outline: 5px dashed salmon
        }
        a{ /*  inline-level*/
           border: 5px solid red;
            
            padding: 5px 5px 5px 5px;

            margin: 10px 20px ;


        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem são exemplos de box-level, mas os <a href="#">os links são exemplos de caixas inline-level</a></p>
</body>
</html>
