<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina da tag picture</title>
</head>
<body>
    <h1>Picture</h1>
    <picture>
        <source media="(min-width:1000px)" srcset="foto-g.png" type="image/png">
        <source media="(min-width:750px)" srcset="foto-m.png" type="image/png">
        <img src="foto-p.png" alt="foto flexível">
    </picture>
</body>
</html>
