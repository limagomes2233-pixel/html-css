<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
       div.conteiner{
            background-color: brown;
            display: flex;
            flex-flow: row wrap;
           
            
        }

        div.item{
            background-color: turquoise;
            padding: 20px;
            border: 1px solid rgb(59, 21, 21);
            text-align: center;

            
          }


        
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="l1">A</div>
        <div class="item" id="l2">B</div>
        <div class="item" id="l3">C</div>
        <div class="item" id="l4">D</div>
        <div class="item" id="l5">E</div>
        <div class="item" id="l6">F</div>
        <div class="item" id="l7">G</div>
        <div class="item" id="l8">H</div>
        <div class="item" id="l9">I</div>

    </div>
</body>
</html>
