<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
       div.conteiner{
            background-color: brown;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: turquoise;
            padding: 20px;
            border: 1px solid black;
            text-align: center;
           
        }
        #caixa-a{
            flex: 2 1 200px;
        }
        #caixa-b{
           flex: auto;
        }
        #caixa-c{
            flex: 2 0 300px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="caixa-a">A</div>
        <div class="item" id="caixa-b">B</div>
        <div class="item" id="caixa-c">C</div>
    </div>
</body>
</html>
