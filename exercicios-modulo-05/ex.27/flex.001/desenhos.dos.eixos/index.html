<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Eixos do Flexbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 900px;
        }
        .card {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Eixos do Flexbox (Guia Visual)</h1>

    <div class="grid">
        <!-- 1. ROW -->
        <div class="card">
            <h3>flex-direction: row</h3>
            <svg width="360" height="220" viewBox="0 0 360 220">
                <!-- Container -->
                <rect x="50" y="40" width="260" height="130" rx="8" fill="#3a3a3a" stroke="#ffffff" stroke-width="2"/>
                <!-- Items -->
                <rect x="70" y="80" width="40" height="40" rx="4" fill="#4caf50"/>
                <rect x="120" y="80" width="40" height="40" rx="4" fill="#4caf50"/>
                <rect x="170" y="80" width="40" height="40" rx="4" fill="#4caf50"/>
                <!-- Main Axis (Red) -->
                <line x1="60" y1="20" x2="295" y2="20" stroke="#ff5252" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="180" y="15" fill="#ff5252" font-size="12" font-weight="bold" text-anchor="middle">MAIN-AXIS ➔</text>
                <text x="50" y="35" fill="#ff5252" font-size="10">main-start</text>
                <text x="260" y="35" fill="#ff5252" font-size="10">main-end</text>
                <!-- Cross Axis (Blue) -->
                <line x1="25" y1="50" x2="25" y2="155" stroke="#448aff" stroke-width="3" marker-end="url(#arrow-blue)"/>
                <text x="20" y="110" fill="#448aff" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 20,110)">CROSS-AXIS ➔</text>
                <text x="30" y="50" fill="#448aff" font-size="10">cross-start</text>
                <text x="30" y="170" fill="#448aff" font-size="10">cross-end</text>
            </svg>
        </div>

        <!-- 2. ROW-REVERSE -->
        <div class="card">
            <h3>flex-direction: row-reverse</h3>
            <svg width="360" height="220" viewBox="0 0 360 220">
                <!-- Container -->
                <rect x="50" y="40" width="260" height="130" rx="8" fill="#3a3a3a" stroke="#ffffff" stroke-width="2"/>
                <!-- Items -->
                <rect x="250" y="80" width="40" height="40" rx="4" fill="#4caf50"/>
                <rect x="200" y="80" width="40" height="40" rx="4" fill="#4caf50"/>
                <rect x="150" y="80" width="40" height="40" rx="4" fill="#4caf50"/>
                <!-- Main Axis (Red) Inverted -->
                <line x1="300" y1="20" x2="65" y2="20" stroke="#ff5252" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="180" y="15" fill="#ff5252" font-size="12" font-weight="bold" text-anchor="middle">◄ MAIN-AXIS</text>
                <text x="260" y="35" fill="#ff5252" font-size="10">main-start</text>
                <text x="50" y="35" fill="#ff5252" font-size="10">main-end</text>
                <!-- Cross Axis (Blue) -->
                <line x1="25" y1="50" x2="25" y2="155" stroke="#448aff" stroke-width="3" marker-end="url(#arrow-blue)"/>
                <text x="20" y="110" fill="#448aff" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 20,110)">CROSS-AXIS ➔</text>
                <text x="30" y="50" fill="#448aff" font-size="10">cross-start</text>
                <text x="30" y="170" fill="#448aff" font-size="10">cross-end</text>
            </svg>
        </div>

        <!-- 3. COLUMN -->
        <div class="card">
            <h3>flex-direction: column</h3>
            <svg width="360" height="220" viewBox="0 0 360 220">
                <!-- Container -->
                <rect x="80" y="20" width="200" height="160" rx="8" fill="#3a3a3a" stroke="#ffffff" stroke-width="2"/>
                <!-- Items -->
                <rect x="160" y="30" width="40" height="35" rx="4" fill="#ff9800"/>
                <rect x="160" y="75" width="40" height="35" rx="4" fill="#ff9800"/>
                <rect x="160" y="120" width="40" height="35" rx="4" fill="#ff9800"/>
                <!-- Main Axis (Red) - Vertical -->
                <line x1="50" y1="30" x2="50" y2="165" stroke="#ff5252" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="40" y="100" fill="#ff5252" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 40,100)">MAIN-AXIS ➔</text>
                <text x="15" y="25" fill="#ff5252" font-size="10">main-start</text>
                <text x="20" y="180" fill="#ff5252" font-size="10">main-end</text>
                <!-- Cross Axis (Blue) - Horizontal -->
                <line x1="90" y1="200" x2="265" y2="200" stroke="#448aff" stroke-width="3" marker-end="url(#arrow-blue)"/>
                <text x="180" y="215" fill="#448aff" font-size="12" font-weight="bold" text-anchor="middle">CROSS-AXIS ➔</text>
                <text x="80" y="195" fill="#448aff" font-size="10">cross-start</text>
                <text x="240" y="195" fill="#448aff" font-size="10">cross-end</text>
            </svg>
        </div>

        <!-- 4. COLUMN-REVERSE -->
        <div class="card">
            <h3>flex-direction: column-reverse</h3>
            <svg width="360" height="220" viewBox="0 0 360 220">
                <!-- Container -->
                <rect x="80" y="20" width="200" height="160" rx="8" fill="#3a3a3a" stroke="#ffffff" stroke-width="2"/>
                <!-- Items -->
                <rect x="160" y="120" width="40" height="35" rx="4" fill="#ff9800"/>
                <rect x="160" y="75" width="40" height="35" rx="4" fill="#ff9800"/>
                <rect x="160" y="30" width="40" height="35" rx="4" fill="#ff9800"/>
                <!-- Main Axis (Red) - Vertical Inverted -->
                <line x1="50" y1="170" x2="50" y2="35" stroke="#ff5252" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="40" y="100" fill="#ff5252" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 40,100)">◄ MAIN-AXIS</text>
                <text x="20" y="180" fill="#ff5252" font-size="10">main-start</text>
                <text x="15" y="25" fill="#ff5252" font-size="10">main-end</text>
                <!-- Cross Axis (Blue) - Horizontal -->
                <line x1="90" y1="200" x2="265" y2="200" stroke="#448aff" stroke-width="3" marker-end="url(#arrow-blue)"/>
                <text x="180" y="215" fill="#448aff" font-size="12" font-weight="bold" text-anchor="middle">CROSS-AXIS ➔</text>
                <text x="80" y="195" fill="#448aff" font-size="10">cross-start</text>
                <text x="240" y="195" fill="#448aff" font-size="10">cross-end</text>
            </svg>
        </div>
    </div>

    <!-- Definidores das Setas do SVG -->
    <svg width="0" height="0">
        <defs>
            <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="#ff5252"/>
            </marker>
            <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="#448aff"/>
            </marker>
        </defs>
    </svg>

</body>
</html>
