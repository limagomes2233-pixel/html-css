<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
       div.conteiner{
            background-color: brown;
            display: flex;
            flex-flow: row wrap;
           
        }

        div.item{
            background-color: turquoise;
            border: 1px solid black;
            flex: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exempol de bloco A</div>
        <div class="item">Exempol de bloco B</div>
        <div class="item">Exempol de bloco C</div>
        <div class="item">Exempol de bloco D</div>
        <div class="item">Exempol de bloco E</div>
        <div class="item">Exempol de bloco F</div>
        <div class="item">Exempol de bloco G</div>
    </div>
</body>
</html>
