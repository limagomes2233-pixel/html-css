<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabela</title>
    <style>
     body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        caption{
            font-size: 1.2em;

        }
        th, td{
            border: 1px solid gray;
            padding: 10px;
        }
        .nome{
            background-color: blueviolet;
        }
        .cgrupo{
            background-color: chartreuse;
            font-size: xx-large;
        }
    </style>
</head>
<body>
    <h1>Exercicio de tabelas</h1>
<table>
    <colgroup>
    <col class="nome">
    <col class="cgrupo" span="3">
    </colgroup>
    <caption>
        Cadastro
    </caption>
    <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
    </tr>
            <tr>
                <td>Ana Maria</td>
                <td>f</td>
                <td>25</td>
                <td>Jornalismo</td>
            </tr>
            <tr>
                <td>josue</td>
                <td>m</td>
                <td>30</td>
                <td>Auxiliar de pedreiro</td>
            </tr>
            <tr>
                <td>marina</td>
                <td>f</td>
                <td>24</td>
                <td>Professora</td>
            </tr>
            <tr>
                <td>Ana Claúdia</td>
                <td>f</td>
                <td>35</td>
                <td>Pizzaiola</td>
            </tr>
            <tr>
                <td>Vinicius</td>
                <td>m</td>
                <td>27</td>
                <td>Açougueiro</td>
            </tr>
            <tr>
                <td>malbeq</td>
                <td>m</td>
                <td>60</td>
                <td>herbalista</td>
            </tr>
</table>
</body>
</html>
