<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Dados Pessoais</legend>
            <p><label for="inome">nome</label>
            <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
                <p>
            <label for="iemail">Email</label>
            <input type="email" name="email" id="iemail" required autocomplete="email">
                </p>
                <p>
            <label for="itel"> Telefone</label>
            <input type="tel" name="telefone" id="itel" required autocomplete="tel"
            pattern="^[0-9]{4,5}-[0-9]{4,5}"$ placeholder="(xx)xxxx-xxxx">
                </p>
        </fieldset>


    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="apagar">
    </p>

    </form>
</body>
</html>
