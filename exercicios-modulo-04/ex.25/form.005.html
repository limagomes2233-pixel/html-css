<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="masc" value="M">Masculino <br>
            <input type="radio" name="sexo" id="femi" checked value="F"> feminino
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>

            <label for="iesfut"><input type="checkbox" name="esfut" id="iesfut" checked> Futebol</label> <br> 

            <label for="iebas"><input type="checkbox" name="esbas" id="iebas">Basquete</label> <br>

            <label for="iesnat"><input type="checkbox" name="esnat" id="iesnat">Natação <br></label>

            <label for="iesten"><input type="checkbox" name="esten" id="iesten">Tênis </label><br>
        </fieldset>




        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="Excluir">
        </p>
    </form>
</body>
</html>
